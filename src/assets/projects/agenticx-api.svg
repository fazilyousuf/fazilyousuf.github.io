<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#05090f" />
    </linearGradient>
    <linearGradient id="cyanGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ae8d2" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowApi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradApi)" />

  <circle cx="300" cy="140" r="120" fill="rgba(10, 232, 210, 0.09)" filter="url(#glowApi)" />

  <g transform="translate(120, 38)">
    <rect x="0" y="0" width="360" height="225" rx="14" fill="#090f19" stroke="rgba(10, 232, 210, 0.35)" stroke-width="1.5" />
    
    <rect x="0" y="0" width="360" height="36" rx="14" fill="#050a12" />
    <rect x="0" y="24" width="360" height="12" fill="#050a12" />
    
    <circle cx="18" cy="18" r="4.5" fill="#ff5f56" />
    <circle cx="32" cy="18" r="4.5" fill="#ffbd2e" />
    <circle cx="46" cy="18" r="4.5" fill="#27c93f" />

    <rect x="75" y="9" width="190" height="18" rx="5" fill="rgba(10, 232, 210, 0.08)" stroke="rgba(10, 232, 210, 0.2)" stroke-width="1" />
    <text x="170" y="22" fill="#0ae8d2" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">api.agenticx.in/docs</text>
    
    <rect x="275" y="9" width="70" height="18" rx="4" fill="rgba(10, 232, 210, 0.15)" stroke="#0ae8d2" stroke-width="1" />
    <text x="310" y="21" fill="#0ae8d2" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">FastAPI ⚡</text>

    <g transform="translate(20, 50)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="10" y="14" fill="rgba(255, 255, 255, 0.5)" font-family="monospace" font-size="8">ENDPOINTS</text>
        <text x="10" y="28" fill="#0ae8d2" font-family="monospace" font-size="12" font-weight="700">120+ REST</text>

        <rect x="110" y="0" width="100" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="120" y="14" fill="rgba(255, 255, 255, 0.5)" font-family="monospace" font-size="8">DATABASE</text>
        <text x="120" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">PostgreSQL</text>

        <rect x="220" y="0" width="100" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="230" y="14" fill="rgba(255, 255, 255, 0.5)" font-family="monospace" font-size="8">WORKERS</text>
        <text x="230" y="28" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">Gunicorn (4x)</text>
      </g>

      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="320" height="24" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)" />
        <rect x="6" y="4" width="40" height="16" rx="3" fill="#10b981" />
        <text x="26" y="16" fill="#000" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">POST</text>
        <text x="56" y="16" fill="#ffffff" font-family="monospace" font-size="9">/api/v1/auth/login</text>
        <text x="275" y="16" fill="#10b981" font-family="monospace" font-size="8.5">200 OK</text>

        <rect x="0" y="28" width="320" height="24" rx="4" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(14, 165, 233, 0.25)" />
        <rect x="6" y="32" width="35" height="16" rx="3" fill="#0ea5e9" />
        <text x="23.5" y="44" fill="#000" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">GET</text>
        <text x="51" y="44" fill="#ffffff" font-family="monospace" font-size="9">/api/v1/candidate/records</text>
        <text x="275" y="44" fill="#0ea5e9" font-family="monospace" font-size="8.5">JWT RBAC</text>

        <rect x="0" y="56" width="320" height="24" rx="4" fill="rgba(10, 232, 210, 0.08)" stroke="rgba(10, 232, 210, 0.25)" />
        <rect x="6" y="60" width="40" height="16" rx="3" fill="#0ae8d2" />
        <text x="26" y="72" fill="#000" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">POST</text>
        <text x="56" y="72" fill="#ffffff" font-family="monospace" font-size="9">/api/v1/certificates/verify</text>
        <text x="275" y="72" fill="#0ae8d2" font-family="monospace" font-size="8.5">Signed QR</text>

        <rect x="0" y="84" width="320" height="24" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
        <rect x="6" y="88" width="40" height="16" rx="3" fill="#6366f1" />
        <text x="26" y="100" fill="#fff" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">POST</text>
        <text x="56" y="100" fill="#ffffff" font-family="monospace" font-size="9">/api/v1/payments/webhook</text>
        <text x="275" y="100" fill="#818cf8" font-family="monospace" font-size="8.5">HMAC-256</text>
      </g>
    </g>
  </g>

  <text x="300" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">CENTRAL FASTAPI ENGINE</text>
  <text x="300" y="316" fill="#0ae8d2" font-family="system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1" text-anchor="middle">api.agenticx.in</text>
</svg>
